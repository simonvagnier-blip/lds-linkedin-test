<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Programme LinkedIn Live Data — pilote</title>
<meta name="robots" content="noindex,nofollow">
<style>
@font-face{font-family:Montserrat;src:url(assets/fonts/Montserrat-VF.ttf?v=8);font-weight:100 900;font-display:swap}
@font-face{font-family:Poppins;src:url(assets/fonts/Poppins-Regular.ttf?v=8);font-weight:400;font-display:swap}
@font-face{font-family:Poppins;src:url(assets/fonts/Poppins-Medium.ttf?v=8);font-weight:500;font-display:swap}
@font-face{font-family:Poppins;src:url(assets/fonts/Poppins-SemiBold.ttf?v=8);font-weight:600;font-display:swap}
@font-face{font-family:Poppins;src:url(assets/fonts/Poppins-Bold.ttf?v=8);font-weight:700;font-display:swap}

:root{--navy:#0F172A;--cyan:#0EA5E9;--grey:#F1F5F9;--text:#475569;--line:#E2E8F0;--navh:60px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--navh) + 12px)}
body{margin:0;background:var(--grey);color:var(--navy);font:400 15px/1.5 Poppins,system-ui,sans-serif}
a{color:var(--cyan)}
img[src*="logo_lds_sq.png"]{background:#fff;object-fit:contain!important;padding:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* en-tête */
header.top{background:var(--navy);color:#fff;padding:16px 0 4px}
.brand{display:inline-flex;align-items:center;gap:16px;text-decoration:none;color:#fff;min-height:44px}
.brand img{height:32px}
.brand span{font:700 16px/1.25 Montserrat;color:#fff;border-left:1px solid #334155;padding-left:16px}
.brand small{display:block;font:400 12.5px Poppins;color:#CBD5E1}
nav.nav{position:sticky;top:0;z-index:30;background:var(--navy);box-shadow:0 1px 0 #1E293B}
.navin{display:flex;gap:2px}
.nv{display:flex;align-items:center;justify-content:center;gap:8px;min-height:var(--navh);padding:0 14px;color:#CBD5E1;text-decoration:none;font:600 14.5px Poppins;border-bottom:4px solid transparent;border-top:4px solid transparent;white-space:nowrap}
.nv img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid transparent;flex:none}
.nv:hover{color:#fff}
.nv[aria-current=page]{color:#fff;border-bottom-color:var(--cyan)}
.nv[aria-current=page] img{border-color:var(--cyan)}
.nv.sep{margin-left:auto}
.nv:focus-visible,.btn:focus-visible,.pc:focus-visible,.calpost:focus-visible,.au:focus-visible,.qk:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
main.wrap{padding-top:24px;padding-bottom:48px;min-height:70vh}
main:focus,h1:focus{outline:none}
h1.v{font:800 28px/1.2 Montserrat;margin:0 0 6px;letter-spacing:-.01em}
h2{font:800 21px/1.25 Montserrat;margin:0 0 6px}
.lead{color:var(--text);margin:0 0 16px;font-size:14.5px}
.blk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-top:22px}
.more-l{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;font-weight:600;text-decoration:none}
.more-l:hover{text-decoration:underline}
/* accueil */
.goal{background:var(--navy);color:#fff;border-radius:12px;padding:22px 24px}
.goal h1{font:800 26px/1.2 Montserrat;margin:0 0 8px}
.goal p{margin:0;color:#E2E8F0;max-width:860px}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.tag{display:inline-block;background:var(--cyan);color:#fff;border-radius:999px;padding:2px 10px;font:600 12px Poppins;vertical-align:middle;margin-left:6px}
.who4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.au{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--navy)}
.au:hover{border-color:var(--cyan)}
.au img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.au .ad{display:flex;flex-direction:column}
.au b{font:700 16px Montserrat}
.au .ad span{font-size:13px;color:var(--text)}
.au em{font-style:normal;font:600 13.5px Poppins;color:var(--cyan);margin-top:auto}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.qk{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-decoration:none;color:var(--navy);font:700 15px Montserrat}
.qk small{display:block;font:400 13px Poppins;color:var(--text)}
.qk:after{content:"›";font:600 24px Poppins;color:var(--cyan)}
.qk:hover{border-color:var(--cyan)}
/* cartes de post compactes */
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.pc{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-decoration:none;color:var(--navy)}
.pc:hover{border-color:var(--cyan)}
.pc .th{position:relative;flex:none;width:96px;aspect-ratio:4/5;border-radius:8px;overflow:hidden;background:var(--grey)}
.pc .th img{width:100%;height:100%;object-fit:cover;display:block}
.pc .ty{position:absolute;left:6px;bottom:6px;background:rgba(15,23,42,.85);color:#fff;font:600 10.5px Poppins;border-radius:999px;padding:1px 8px}
.pc .pb{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.pc .pw{display:flex;align-items:center;gap:6px;font:700 13px Montserrat}
.pc .pw img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.pc .pm{font-size:12.5px;color:var(--text)}
.pc .pm b{font-family:Montserrat;color:var(--cyan)}
.pc .pt{font:600 14px/1.35 Poppins}
.pc .op{margin-top:auto;padding-top:4px;font:600 13px Poppins;color:var(--cyan)}
.grid5 .pc{flex-direction:column}
.grid5 .pc .th{width:100%}
.st{align-self:flex-start;display:inline-block;border:1.5px solid var(--navy);border-radius:999px;padding:1px 9px;font:600 11.5px Poppins;color:var(--navy);background:#fff}
/* page auteur */
.ah{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.ah img{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;border:3px solid #fff}
.ah p{margin:0;color:var(--text);font-size:14px}
/* vue post */
.crumb{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:-12px 0 6px;flex-wrap:wrap}
.crumb a{display:inline-flex;align-items:center;min-height:44px;font-weight:600;text-decoration:none}
.crumb span{color:var(--text);font-size:13.5px}
.pv{display:grid;grid-template-columns:minmax(0,555px) minmax(0,1fr);gap:28px;align-items:start}
.pvr{position:sticky;top:calc(var(--navh) + 14px);display:flex;flex-direction:column;gap:14px}
.ph .pm{margin:0 0 4px;color:var(--text);font-size:13.5px}
.ph .pm b{font-family:Montserrat;color:var(--cyan)}
.ph h1.v{font-size:22px}
.ph .st{margin-top:4px}
.acts{display:grid;grid-template-columns:1fr;gap:8px}
.acts .kind{font-size:12.5px;color:var(--text);margin:-2px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 18px;border-radius:999px;font:600 14.5px Poppins;cursor:pointer;text-decoration:none;border:1.5px solid var(--navy);background:#fff;color:var(--navy);text-align:center}
.btn.pri{background:var(--navy);color:#fff}
.btn:hover{border-color:var(--cyan)}
.btn.ok{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn.sm{min-height:44px;font-size:13.5px;padding:6px 14px}
.btn.lk{border-color:transparent;background:transparent;color:var(--text);text-decoration:underline;min-height:44px}
.btn.lk.ok{color:#fff;text-decoration:none}
.info{background:#fff;border:1px solid var(--line);border-radius:10px}
.info details{border-top:1px solid var(--line)}
.info details:first-child{border-top:0}
.info summary{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 16px;cursor:pointer;font:700 12.5px Montserrat;text-transform:uppercase;letter-spacing:.05em;list-style:none}
.info summary::-webkit-details-marker{display:none}
.info summary:after{content:"+";font:500 22px Poppins;color:var(--cyan)}
.info details[open] summary:after{content:"−"}
.info .dd{padding:0 16px 14px;font-size:13.5px;color:var(--text);overflow-wrap:anywhere}
.info .dd .btn{margin-top:10px}
.val{border:1.5px solid var(--navy);border-radius:10px;padding:10px 14px;background:#fff;font-size:13.5px}
.val b,.res b{display:block;font:700 12px Montserrat;text-transform:uppercase;letter-spacing:.05em}
.res{border-left:4px solid var(--cyan);background:#fff;border-radius:8px;padding:10px 14px;font-size:13.5px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pn a,.pn span{display:flex;flex-direction:column;justify-content:center;min-height:56px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;text-decoration:none;color:var(--navy);font-size:12.5px;line-height:1.3}
.pn a:hover{border-color:var(--cyan)}
.pn b{font:700 12px Montserrat;color:var(--cyan)}
.pn .nx{text-align:right}
.pn span{visibility:hidden}
.mbar{display:none}
/* carte façon LinkedIn */
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ch{display:flex;gap:10px;padding:14px 16px 6px;align-items:flex-start}
.ch img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none}
.who b{font:600 15px/1.3 Poppins;display:block}
.who .hl{font-size:12.5px;color:var(--text);line-height:1.35;display:block}
.who .dt{font-size:12.5px;color:var(--text);display:block}
.who .dt em{font-style:normal;color:var(--cyan);font-weight:600}
.pid{margin-left:auto;font:700 12px Montserrat;color:var(--text);background:var(--grey);border-radius:6px;padding:3px 8px;flex:none}
.txt{padding:4px 16px 12px;font-size:14px;line-height:1.43;white-space:pre-wrap;word-wrap:break-word}
.txt .body{display:block}
.media{position:relative;background:var(--grey);aspect-ratio:4/5;width:100%;overflow:hidden}
.media img,.media video{display:block;width:100%;height:100%;object-fit:cover}
.media .missing{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--text);font-size:14px}
.media.err .missing{display:flex}
.track{display:flex;height:100%;transition:transform .35s cubic-bezier(.16,1,.3,1)}
.track img{flex:0 0 100%}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(15,23,42,.78);color:#fff;font:600 22px/44px Poppins;cursor:pointer;padding:0}
.arr.l{left:10px}.arr.r{right:10px}
.arr[disabled]{display:none}
.count{position:absolute;top:10px;right:10px;background:rgba(15,23,42,.78);color:#fff;font:500 12px Poppins;border-radius:999px;padding:3px 10px}
.bar{display:flex;justify-content:space-around;border-top:1px solid var(--line);margin:0 12px;padding:6px 0;color:var(--text);font:600 13px Poppins}
.bar span{padding:8px 6px}
/* mode d'emploi */
.sub{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.sub a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--navy);font:600 13.5px Poppins}
.sub a:hover{border-color:var(--cyan)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px}
ol.steps li{counter-increment:s;position:relative;padding:4px 0 4px 46px;min-height:34px;font-size:14.5px}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;font:700 14px/32px Montserrat;text-align:center}
ol.steps li span{color:var(--text)}
.flow{display:grid;gap:12px}
.fr{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1.6fr);align-items:stretch;gap:0}
.sig,.act{border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.4}
.sig{background:var(--grey);font-weight:600}
.sig small{display:block;font-weight:400;color:var(--text);font-size:12.5px;margin-top:2px}
.act{background:var(--navy);color:#fff}
.act b{color:var(--cyan);font-weight:600}
.fr.none .act{background:#fff;border:1.5px dashed #CBD5E1;color:var(--text)}
.ar{position:relative}
.ar:before{content:"";position:absolute;left:6px;right:10px;top:50%;height:2px;background:var(--cyan)}
.ar:after{content:"";position:absolute;right:4px;top:calc(50% - 6px);border:6px solid transparent;border-left:8px solid var(--cyan);border-right:0}
/* calendrier */
.cal{width:100%;border-collapse:separate;border-spacing:0 8px;table-layout:fixed}
.cal thead th{font:700 13px Montserrat;text-align:left;padding:0 8px 2px;color:var(--navy)}
.cal thead th img{width:26px;height:26px;border-radius:50%;vertical-align:middle;margin-right:6px;object-fit:cover}
.cal th[scope=row]{width:124px;text-align:left;padding:10px 8px;background:var(--navy);color:#fff;border-radius:8px 0 0 8px;vertical-align:top}
.cal .wk{display:block;font:800 18px Montserrat}
.cal .sp{display:block;font-size:12px;color:#CBD5E1}
.cal .now:empty{display:none}
.cal .now{display:inline-block;margin-top:6px;background:var(--cyan);color:#fff;border-radius:999px;padding:1px 8px;font:600 11px Poppins}
.cal tr.cur td{background:#E0F2FE}
.cal td{background:var(--grey);padding:0;vertical-align:top}
.cal td:last-child{border-radius:0 8px 8px 0}
.calpost{display:block;height:100%;min-height:44px;padding:10px;text-decoration:none;font:400 13px/1.35 Poppins;color:var(--navy)}
.calpost:hover{background:#E2E8F0}
.calpost .cd{display:block;color:var(--text);font-size:12px;margin-bottom:2px}
.calpost b{font-family:Montserrat;color:var(--cyan)}
/* organisation (contenu V6 inchangé) */
.org{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.oc{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:#fff}
.oc h3{font:700 16px Montserrat;margin:0 0 8px;color:var(--navy)}
.oc p,.oc li{margin:0 0 6px;color:var(--text);font-size:14px}
.oc ul{margin:0;padding-left:18px}
.oc.k{border-top:4px solid var(--cyan)}
.tm{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.tm th,.tm td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
.tm th{font:700 13px Montserrat;color:var(--navy);background:var(--grey)}
.tm td.n{white-space:nowrap;font-weight:600;color:var(--navy)}
.ms{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.ms span{background:var(--grey);border-radius:999px;padding:6px 14px;font-size:13.5px;color:var(--navy)}
.ms b{color:var(--cyan)}
/* V6.2 commentaires */
.pc .cc{font:600 12px Poppins;color:var(--text)}
.pc .cc:before{content:"💬 ";}
.cmt{background:#fff;border:1px solid var(--line);border-radius:10px}
.cmt>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 16px;cursor:pointer;font:700 13px Montserrat;list-style:none}
.cmt>summary::-webkit-details-marker{display:none}
.cmt>summary small{font:400 12px Poppins;color:var(--text);display:block}
.cmt>summary:after{content:"+";font:500 22px Poppins;color:var(--cyan)}
.cmt[open]>summary:after{content:"−"}
.cmt .cb{padding:0 14px 14px;display:grid;gap:10px}
.cmt .hint{font-size:12.5px;color:var(--text);margin:0}
.cmt .hint a{display:inline-flex;align-items:center;min-height:44px}
.co{display:grid;grid-template-columns:40px 1fr;gap:10px;background:var(--grey);border-radius:10px;padding:10px 12px}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;font:700 14px Montserrat}
.co .cn{font:600 13.5px Poppins;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.co .cw{font:600 11.5px Poppins;color:var(--cyan)}
.co .cr{display:block;font-size:12px;color:var(--text);font-weight:400}
.co p{margin:4px 0 6px;font-size:13.5px;line-height:1.45}
.co .btn{min-height:44px;font-size:13px;padding:4px 14px}
.co.rp{background:#E0F2FE;margin-left:24px}
.co .pl{font:600 12px Poppins;color:var(--cyan);text-decoration:none}
.flt{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.flt a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 6px;border-radius:999px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--navy);font:600 13.5px Poppins}
.flt a .av{width:30px;height:30px;font-size:11px}
.flt a[aria-current]{border-color:var(--cyan);background:#E0F2FE}
.mlist{display:grid;gap:10px;margin-top:12px}
footer{color:var(--text);font-size:12.5px;text-align:center;padding:0 0 32px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.totop{position:fixed;right:18px;bottom:18px;z-index:40;width:48px;height:48px;border-radius:50%;border:0;background:var(--navy);color:#fff;font:600 22px/48px Poppins;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.totop.on{opacity:1;pointer-events:auto}
@media (max-width:960px){
 .grid5{grid-template-columns:repeat(3,1fr)}
 .who4{grid-template-columns:repeat(2,1fr)}
 .org{grid-template-columns:1fr}
 .nv{padding:0 9px}
}
@media (max-width:760px){
 :root{--navh:96px}
 .wrap{padding:0 12px}
 header.top{padding:8px 0 2px}
 .brand{gap:12px}
 .brand img{height:24px}
 .brand span{font-size:13.5px;padding-left:12px}
 .brand small{font-size:11px}
 .navin{display:grid;grid-template-columns:repeat(12,1fr);gap:0;padding:0}
 .nv{min-height:48px;padding:0 2px;gap:5px;font-size:13.5px;grid-column:span 3;order:1;border-top:0;border-bottom-width:3px}
 .nv img{width:24px;height:24px}
 .nv.x{grid-column:span 3;order:2;min-height:44px;font-size:13px;background:#1E293B;border-bottom-width:3px}
 .nv.sep{margin-left:0}
 .nv .lf{display:none}
 main.wrap{padding-top:14px}
 .brand small{display:none}
 h1.v{font-size:23px}
 .goal{padding:16px}
 .goal h1{font-size:21px}
 .goal p{font-size:14px}
 .blk{padding:16px;margin-top:16px}
 .grid4,.grid5,.quick{grid-template-columns:1fr}
 .grid5 .pc{flex-direction:row}
 .pc .th,.grid5 .pc .th{width:84px}
 .who4{grid-template-columns:1fr 1fr;gap:10px}
 .au{padding:12px}
 .au img{width:44px;height:44px}
 .au .ad span{display:none}
 .ah img{width:56px;height:56px}
 .crumb{margin-top:-10px}
 .pv{display:flex;flex-direction:column;gap:14px}
 .pvr{display:contents}
 .ph{order:1}.acts{order:2}.val,.res{order:3}.pvl{order:4}.info{order:5}.cmt{order:6}.pn{order:7}
 .co.rp{margin-left:12px}
 .acts{grid-template-columns:1fr 1fr}
 .acts .kind,.acts .lk{grid-column:1/-1}
 .acts .kind{text-align:center}
 .btn{font-size:14px;padding:8px 10px}
 .pvl{margin:0 -12px}
 .card{border-radius:0;border-left:0;border-right:0}
 body.mbar-on .mbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
 body.haspost main.wrap{padding-bottom:90px}
 body.mbar-on .totop{bottom:82px}
 body.mbar-on .toast{bottom:84px}
 .fr{grid-template-columns:1fr;gap:0}
 .ar{height:22px}
 .ar:before{left:18px;right:auto;top:2px;bottom:6px;width:2px;height:auto}
 .ar:after{left:12px;right:auto;top:auto;bottom:0;border:6px solid transparent;border-top:8px solid var(--cyan);border-bottom:0}
 .cal,.cal tbody,.cal tr,.cal th,.cal td{display:block;width:100%}

ss="ct"><b>S2</b> · Un intentionniste a une date de péremption</span></a></td><td><a class="calpost" href="#L2" data-who="Page Live Data" data-k="L" data-goto="L2"><span class="cd">mercredi 18 novembre, 11 h</span><span class="ct"><b>L2</b> · Le comptage : combien de personnes vous pouvez vraiment toucher</span></a></td></tr><tr data-w="S48"><th scope="row"><span class="wk">S48</span><span class="sp">23 → 27 nov.</span><span class="now"></span></th><td><a class="calpost" href="#J3" data-who="Joanna" data-k="J" data-goto="J3"><span class="cd">mardi 24 novembre, 8 h 30</span><span class="ct"><b>J3</b> · Actu : Black Friday, le prix barré est contrôlé</span></a></td><td><a class="calpost" href="#P3" data-who="Pierre" data-k="P" data-goto="P3"><span class="cd">mercredi 25 novembre, 8 h 30</span><span class="ct"><b>P3</b> · Un réseau, ce n&#x27;est pas un marché, c&#x27;est 300 marchés</span></a></td><td><a class="calpost" href="#S3" data-who="Simon" data-k="S" data-goto="S3"><span class="cd">jeudi 26 novembre, 9 h</span><span class="ct"><b>S3</b> · Les 3 familles de signaux d&#x27;intention</span></a></td><td><a class="calpost" href="#L3" data-who="Page Live Data" data-k="L" data-goto="L3"><span class="cd">jeudi 26 novembre, 11 h</span><span class="ct"><b>L3</b> · Instant Mail® : ×2 sur le taux d&#x27;ouverture</span></a></td></tr><tr data-w="S49"><th scope="row"><span class="wk">S49</span><span class="sp">30 nov. → 4 déc.</span><span class="now"></span></th><td><a class="calpost" href="#J4" data-who="Joanna" data-k="J" data-goto="J4"><span class="cd">mardi 1er décembre, 8 h 30</span><span class="ct"><b>J4</b> · Actu : démarchage téléphonique, ce qui a changé le 11 août</span></a></td><td><a class="calpost" href="#P4" data-who="Pierre" data-k="P" data-goto="P4"><span class="cd">mercredi 2 décembre, 8 h 30</span><span class="ct"><b>P4</b> · 5 choses que j&#x27;ai apprises en parlant avec des directeurs de magasin</span></a></td><td><a class="calpost" href="#S4" data-who= <template id="tpl-mode">
<h1 class="v" tabindex="-1">Mode d'emploi</h1>
<p class="lead">Publier un post, qui fait quoi, combien de temps, et ce qu'on fait des réactions.</p>
<nav class="sub" aria-label="Dans cette page"><a href="#publier">Publier un post</a><a href="#organisation">Organisation et temps</a><a href="#like-rdv">Du like au RDV</a><a href="#commenter">Commenter les posts des collègues</a></nav>
<div class="blk" id="publier">
 <h2>Publier un post, en 6 étapes</h2>
 <ol class="steps">
  <li><b>Ouvrez votre onglet</b> en haut de page : Joanna, Pierre, Simon ou Live Data. <span>Vos 5 posts y sont, dans l'ordre de publication. Le post de la semaine est aussi sur l'accueil.</span></li>
  <li><b>Ouvrez le post et relisez-le.</b> <span>Corrigez avec vos mots si besoin : rien ne part sans votre accord. Un post marqué « À valider » attend d'abord sa relecture.</span></li>
  <li><b>« Copier le texte »</b>, puis collez-le dans LinkedIn (« Commencer un post »).</li>
  <li><b>« Télécharger le visuel »</b>, puis ajoutez-le au post. <span>Image : comme une photo. Animation : comme une vidéo. Carrousel : comme un document (PDF).</span></li>
  <li><b>Publiez à la date prévue.</b> <span>Elle est indiquée sur chaque post et dans le calendrier.</span></li>
  <li><b>Collez la source en premier commentaire</b> (rubrique « Source », bouton « Copier la source »), puis répondez aux commentaires pendant 48 h.</li>
 </ol>
 <p class="lead" style="margin:14px 0 0">Pour envoyer un post précis à quelqu'un : « Copier le lien du post ». Chaque post a sa propre adresse (…/#J2, #P3…).</p>
</div>

 <div class="blk" id="organisation">
  <h2>Organisation</h2>
  <p class="lead">Qui écrit, qui publie, et combien de temps ça prend chaque semaine.</p>
  <div class="org">
   <div class="oc k"><h3>Qui écrit</h3><p>Hermes écrit et propose les posts : textes, visuels, sources vérifiées.</p><p>Chaque auteur relit, corrige avec ses mots, et valide. Rien ne part sans son accord.</p></div>
   <div class="oc k"><h3>Qui publie</h3><ul><li>Joanna, Pierre et Simon publient chacun depuis leur propre compte LinkedIn.</li><li>La page Live Data Solutions est publiée par l'administrateur de la page (à confirmer).</li></ul></div>
   <div class="oc k"><h3>Ce qu'on publie</h3><ul><li>Comptes perso : personal branding, sur l'expertise de chacun. Pas de vente des offres Live Data.</li><li>Page Live Data : solutions et produits.</li></ul></div>
  </div>
  <div class="org" style="margin-top:14px">
   <div class="oc"><h3>Rythme</h3><p>1 post par personne et par semaine, du mardi au jeudi, entre 8 h et 9 h 30.</p><p>1 post par semaine sur la page Live Data.</p></div>
   <div class="oc"><h3>Les équipes</h3><p>Elles commentent les posts de la page Live Data avec de vrais commentaires, chacun quand il le souhaite. Pas de rafale coordonnée.</p></div>
   <div class="oc"><h3>Avant le premier post</h3><p>Validation du programme par le DPO.</p><p>Posts RGPD et réglementation de Joanna relus juridiquement avant publication.</p></div>
  </div>
  <table class="tm">
   <thead><tr><th>Temps par semaine</th><th>Ce qu'il y a à faire</th><th>Total estimé</th></tr></thead>
   <tbody>
    <tr><td class="n">Joanna, Pierre</td><td>Relire, valider et publier son post (~15 min). Répondre aux commentaires les 48 h suivantes (~15-20 min par jour).</td><td class="n">≈ 45 min à 1 h</td></tr>
    <tr><td class="n">Simon</td><td>Idem, plus le tri des signaux préparé par Hermes, le vendredi (~30 min).</td><td class="n">≈ 1 h 15 à 1 h 30</td></tr>
    <tr><td class="n">Admin de la page</td><td>Publier le post de la page Live Data préparé par Hermes.</td><td class="n">≈ 15 min</td></tr>
    <tr><td class="n">Hermes</td><td>Rédaction, visuels, vérification des sources, tri des signaux.</td><td class="n">—</td></tr>
   </tbody>
  </table>
  <div class="ms"><span><b>Avant le 10/11</b> · validation DPO</span><span><b>10/11</b> · lancement</span><span><b>10/11 → 10/12</b> · 5 semaines, 20 posts</span><span><b>18/12</b> · bilan</span></div>
 </div>


 <div class="blk" id="like-rdv">
  <h2>Du like au RDV</h2>
  <p class="lead">Ce qu'on fait de chaque réaction. Une réaction n'est pas un accord : on ne pousse rien sans intérêt exprimé.</p>
  <div class="flow"><div class="fr"><div class="sig">Commentaire avec une question</div><div class="ar" aria-hidden="true"></div><div class="act"><b>Message sous 48 h</b>, puis proposition de <b>RDV</b>.</div></div><div class="fr"><div class="sig">Demande de la ressource<small>grille, comptage gratuit…</small></div><div class="ar" aria-hidden="true"></div><div class="act"><b>Envoi de la ressource</b>, puis proposition d'un échange.</div></div><div class="fr"><div class="sig">Like d'une personne ciblée</div><div class="ar" aria-hidden="true"></div><div class="act"><b>Invitation sans note.</b> Un message seulement après un intérêt exprimé.</div></div><div class="fr none"><div class="sig">Réaction hors cible</div><div class="ar" aria-hidden="true"></div><div class="act">Rien.</div></div></div>
 </div>

<div class="blk" id="commenter">
 <h2>Commenter les posts des collègues</h2>
 <p class="lead">Pourquoi : LinkedIn montre davantage un post qui suscite de vrais échanges, mais réduit sa portée quand l'engagement paraît coordonné. Ces règles gardent les commentaires naturels.</p>
 <ol class="steps">
  <li><b>Réécrivez avec vos mots.</b> <span>Ne copiez-collez jamais une proposition telle quelle : LinkedIn repère les textes identiques. Elle sert de point de départ.</span></li>
  <li><b>Commentez seulement si vous avez lu le post.</b> <span>Un commentaire qui ajoute un fait, une question ou un retour terrain vaut plus que dix « bravo ».</span></li>
  <li><b>Pas plus de 2 à 3 collègues dans la première heure.</b> <span>Le moment conseillé est indiqué sur chaque proposition.</span></li>
  <li><b>Étalez sur 24 h.</b> <span>Dans les 2 h, en fin de journée, le lendemain : un fil qui vit dans la durée porte plus loin.</span></li>
  <li><b>L'auteur répond à chaque commentaire.</b> <span>Une réponse type est proposée sous chaque post ; les fils de discussion comptent pour l'algorithme.</span></li>
  <li><b>Pas de quota.</b> <span>Personne n'est obligé de commenter. Vos propositions : onglet « Commentaires », filtre par prénom.</span></li>
 </ol>
</div>
