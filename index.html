 angle de dirigeante : le risque concerne toutes les entreprises, pas seulement les géants.", "source": "CNIL, « Sanctions et mesures correctrices : la CNIL présente le bilan 2025 », 09/02/2026 — cnil.fr/fr/bilan-sanctions-2025 ; CNIL, rapport annuel 2025, 18/05/2026 — cnil.fr/fr/rapport-annuel-2025", "ressource": "aucune.", "valider": "validation juridique avant publication.", "valider_par": "Joanna", "text": "486 839 500 €. C'est le montant des amendes prononcées par la CNIL en 2025.\n\nNeuf fois plus qu'en 2024. Sauf que ce chiffre est trompeur.\n\nL'essentiel vient de deux décisions sur les cookies, contre Google et Shein. Ce ne sont pas elles qui devraient vous inquiéter.\n\nLe chiffre qui compte, c'est celui-ci : sur 83 sanctions, 67 ont été prononcées en procédure simplifiée. Des entreprises de toutes tailles, tous secteurs.\n\nAutrement dit, la CNIL ne contrôle plus seulement les géants. Elle va plus vite, et elle va partout.\n\nTrois questions que je pose en comité de direction :\n→ Qui, chez nous, sait où sont toutes nos données clients ?\n→ Pouvons-nous prouver chaque consentement, avec la date et la source ?\n→ Qui est prévenu en premier si la CNIL appelle demain ?\n\nVous auriez les réponses, chez vous ?", "media": {"type": "image", "src": "visuels/N_J2.png?v=8"}, "download": "visuels/N_J2.png?v=8", "thumb": "visuels/N_J2.png?v=8", "kind": "image (PNG), à ajouter comme une photo", "reply": {"by": "Joanna", "to": "Pierre", "text": "Par un inventaire, Pierre. Une feuille simple : quelles données, d'où elles viennent, qui y a accès, avec quel consentement. Pas besoin d'un grand projet pour voir où sont les trous. Le reste se traite ensuite, une priorité après l'autre."}, "comments": [{"who": "Florence Guichard", "when": "dans l'heure", "text": "La troisième question est celle qui coince le plus souvent. On sait en général qui gère le CRM, beaucoup moins qui prend l'appel. Mieux vaut le décider avant d'en avoir besoin."}, {"who": "Myriam Thiry", "when": "en fin de matinée", "text": "Sur la deuxième question, je vois souvent des bases où le consentement existe, mais sans date ni source. Sur le papier tout va bien. Le jour où il faut le prouver ligne par ligne, c'est une autre histoire."}, {"who": "Pierre Sadain", "when": "le lendemain", "text": "Les 67 procédures simplifiées parlent aussi aux réseaux de magasins : une enseigne régionale n'a pas toujours un service juridique sous la main. Joanna, par quoi commencerais-tu avec une petite équipe ?"}]}, {"id": "J3", "date": "mardi 24 novembre, 8 h 30", "title": "Actu : Black Friday, le prix barré est contrôlé", "format": "visuel fixe — une étiquette « 49 € » barrée à côté d'un prix réduit, avec la règle : « Prix de référence = le prix le plus bas des 30 derniers jours ». Prix fictifs, signalés comme tels.", "pourquoi": "actu de la semaine du Black Friday (27/11) ; Joanna parle de réglementation qui impacte directement les marques et de la confiance des clients.", "source": "sondage OpinionWay pour Shopfully, 1 020 personnes, 18–21/09/2026, relayé par e-marketing.fr (octobre 2026) — e-marketing.fr/marques-1296/veille-et-tribune-2251/achats-de-noel-comment-les-francais-preparent-leurs-achats-175674 ; DGCCRF, « Annonces de réduction de prix : ce que vous devez savoir », règle en vigueur, page consultée le 29/10/2026 — economie.gouv.fr/dgccrf/les-fiches-pratiques/annonces-de-reduction-de-prix-ce-que-vous-devez-savoir", "ressource": "aucune.", "valider": "validation juridique avant publication. La règle des 30 jours date de 2022 : c'est l'étude Shopfully qui fait l'actualité.", "valider_par": "Joanna", "text": "Vendredi, c'est le Black Friday. Et chaque prix barré sera regardé de près.\n\n27 % des Français se disent « chasseurs de bonnes affaires ». Pour eux, le Black Friday est le coup d'envoi des achats de Noël. Ils comparent, ils vérifient, et 37 % d'entre eux comptent utiliser l'IA pour trouver les meilleures offres.\n\nPendant ce temps, la règle n'a pas changé : une réduction annoncée doit partir du prix le plus bas pratiqué au cours des 30 derniers jours. Pas du prix de l'été. Pas d'un prix « conseillé ».\n\nEt le mot « soldes » reste interdit en dehors des périodes légales.\n\nCe qui me frappe : on a des clients qui vérifient chaque prix avec une IA, et des marques qui prennent encore le risque d'un prix de référence gonflé. Une fausse promo se voit plus vite qu'avant.\n\nUne bonne promo, c'est aussi une promo qu'on peut défendre.\n\nVous avez vérifié vos prix de référence avant vendredi ?", "media": {"type": "image", "src": "visuels/N_J3.png?v=8"}, "download": "visuels/N_J3.png?v=8", "thumb": "visuels/N_J3.png?v=8", "kind": "image (PNG), à ajouter comme une photo", "reply": {"by": "Joanna", "to": "Fanny", "text": "Très juste, Fanny. On écrit encore nos offres pour des humains pressés. Demain, une partie sera lue d'abord par une IA qui compare tout. Raison de plus pour avoir des prix de référence propres."}, "comments": [{"who": "Pierre Sadain", "when": "dans les 2 h", "text": "En magasin, c'est pareil. Les clients arrivent avec le prix vu en ligne sur leur téléphone et comparent devant le rayon. Une étiquette approximative se voit tout de suite, et la confiance part avec."}, {"who": "Fanny Carrière", "when": "en fin de journée", "text": "Le chiffre sur l'IA m'interpelle. Si plus d'un tiers des chasseurs de bonnes affaires confient la comparaison à un assistant, les marques doivent aussi se demander comment leurs offres sont lues par ces outils."}, {"who": "Myriam Thiry", "when": "le lendemain", "text": "Il y a aussi un effet sur la fidélité. Un client qui se sent piégé par une fausse promo ne revient pas en janvier, et le reconquérir coûte bien plus cher que la remise."}]}, {"id": "J4", "date": "mardi 1er décembre, 8 h 30", "title": "Actu : démarchage téléphonique, ce qui a changé le 11 août", "format": "animation 12 s (reprise de la V5) — une frise avec le 11 août 2026 ; après la date, chaque appel s'arrête sur « Accord préalable ? » et seuls ceux qui portent « accord prouvé » passent.", "pourquoi": "réglementation qui change le quotidien des équipes commerciales et marketing ; Joanna en tire une conviction sur la collecte du consentement.", "source": "Service-Public.fr, « Démarchage téléphonique abusif, spam vocal ou par SMS : que faire ? », vérifié le 12/08/2026 — service-public.gouv.fr/particuliers/vosdroits/F33267", "ressource": "aucune.", "valider": "validation juridique avant publication.", "valider_par": "Joanna", "text": "Depuis le 11 août, appeler un particulier pour lui vendre quelque chose suppose son accord préalable.\n\nIl y a des exceptions, notamment quand un contrat est en cours. Mais pour la conquête, la règle a changé.\n\nCe que ça veut dire, concrètement :\n→ un numéro sans preuve de consentement ne sert plus à prospecter ;\n→ cet accord est valable un an au maximum ;\n→ sa preuve doit être conservée trois ans.\n\nEt le réflexe « on passe par l'email ou le SMS » ne règle rien : en BtoC, ces canaux demandent eux aussi un accord préalable, sauf pour ses propres clients et sous conditions.\n\nJe crois que c'est une bonne nouvelle pour ceux qui travaillent proprement. Le vrai chantier n'est plus le fichier. C'est le moment où on demande l'accord : sur le site, en magasin, au moment d'un devis.\n\nTrois mois après, où en êtes-vous ?", "media": {"type": "video", "src": "anim/FL1.mp4?v=8", "poster": "anim/FL1.png?v=8"}, "download": "anim/FL1.mp4?v=8", "thumb": "anim/FL1.png?v=8", "kind": "animation (vidéo MP4), à ajouter comme une vidéo", "reply": {"by": "Joanna", "to": "Simon", "text": "Oui, et c'est souvent là que ça bouge le plus. Le vendeur au comptoir devient un point de collecte à part entière. Encore faut-il lui donner une phrase simple pour expliquer à quoi sert l'accord."}, "comments": [{"who": "Myriam Thiry", "when": "dans les 2 h", "text": "Le moment où on demande l'accord, c'est la clé. On voit encore des formulaires où la case existe, mais personne ne sait expliquer à quoi elle engage. Résultat : un accord fragile, et une base qui ne sert pas."}, {"who": "Florence Guichard", "when": "en fin de matinée", "text": "J'insiste sur la conservation de la preuve. Recueillir l'accord ne suffit pas : il faut pouvoir le retrouver trois ans plus tard, avec la date et le contexte. Ça vaut le coup de vérifier ce que permet son outil aujourd'hui."}, {"who": "Simon Vagnier", "when": "le lendemain", "text": "Je partage la lecture « bonne nouvelle ». Moins de volume, mais des contacts qui ont vraiment dit oui. Joanna, tu vois déjà des équipes revoir leur parcours de collecte en magasin ?"}]}, {"id": "J5", "date": "mardi 8 décembre, 8 h 30", "title": "Actu : réseaux sociaux et moins de 15 ans, ce qu'il reste de la loi", "format": "visuel fixe — frise en trois dates : 21 juillet (loi adoptée), 14 août (interdiction censurée par le Conseil constitutionnel), 24 août (loi promulguée sans elle).", "pourquoi": "sujet cité par Simon et Joanna (« interdiction réseaux sociaux ») ; Joanna l'analyse sous l'angle de la donnée et des marques, pas de la polémique.", "source": "Vie-publique.fr, « Loi du 24 août 2026 visant à protéger les mineurs des risques auxquels les expose l'utilisation des réseaux sociaux », 25/08/2026 — vie-publique.fr/loi/301799-proteger-les-mineurs-risques-des-reseaux-sociaux-loi-du-24-aout-2026 ; Conseil constitutionnel, décision n° 2026-911 DC du 14/08/2026.", "ressource": "aucune.", "valider": "validation juridique avant publication.", "valider_par": "Joanna", "text": "On a beaucoup lu que les réseaux sociaux seraient interdits aux moins de 15 ans en France. Ce n'est pas le cas.\n\nLe 21 juillet, le Parlement a adopté une loi qui prévoyait cette interdiction.\nLe 14 août, le Conseil constitutionnel l'a censurée : une interdiction générale porte une atteinte jugée disproportionnée à la liberté d'expression, et le texte ne garantissait pas assez le respect de la vie privée.\nLe 24 août, la loi a été promulguée sans elle. Il reste notamment l'interdiction du portable au lycée.\n\nPourquoi j'en parle ici ? Parce que la question de fond n'est pas tranchée : comment vérifier l'âge de quelqu'un sans collecter encore plus de données sur lui ?\n\nC'est la même tension que dans tous nos métiers. Plus on veut protéger, plus on a besoin de savoir qui est en face. Et plus il faut être irréprochable sur ce qu'on fait de cette information.\n\nLe sujet va revenir. Les marques qui s'adressent aux jeunes ont intérêt à s'y préparer dès maintenant.\n\nVérifier l'âge sans tout savoir de la personne : vous pensez que c'est possible ?", "media": {"type": "image", "src": "visuels/N_J5.png?v=8"}, "download": "visuels/N_J5.png?v=8", "thumb": "visuels/N_J5.png?v=8", "kind": "image (PNG), à ajouter comme une photo", "reply": {"by": "Joanna", "to": "Fanny", "text": "C'est tout l'enjeu, Fanny. On parle de solutions qui prouveraient un âge sans révéler l'identité. Reste à voir si elles tiennent à grande échelle, et qui les opère."}, "comments": [{"who": "Fanny Carrière", "when": "dans les 2 h", "text": "La question de fond est passionnante. Vérifier un âge sans créer un nouveau fichier de pièces d'identité, c'est exactement le cas où le principe « collecter le minimum » devrait guider la solution."}, {"who": "Simon Vagnier", "when": "en fin de journée", "text": "On retrouve cette tension en ciblage. Plus on veut être précis, plus on est tenté de collecter. La bonne question reste : quelle donnée est vraiment nécessaire, avant de se demander comment l'obtenir."}, {"who": "Florence Guichard", "when": "le lendemain", "text": "Merci pour la frise, elle remet les faits dans l'ordre. Beaucoup ont retenu l'annonce, pas la censure. Pour les marques qui parlent aux jeunes, la prudence sur leurs données reste de mise, avec ou sans loi."}]}]}, {"key": "P", "name": "Pierre Sadain", "first": "Pierre", "role": "Sales Manager", "photo": "assets/pierre.jpg?v=8", "headline": "Sales Manager · Live Data Solutions", "topics": "Vision locale, drive-to-store, retail", "posts": [{"id": "P1", "date": "jeudi 12 novembre, 8 h 30", "title": "Actu : Noël se joue encore en magasin", "format": "visuel fixe (repris de la V5) — grand chiffre « 8 sur 10 » et une mini-carte de trois zones de magasin.", "pourquoi": "actu chiffrée de saison, au cœur du sujet de Pierre : le magasin reste le centre du parcours, et chaque magasin a sa zone.", "source": "sondage OpinionWay pour Shopfully, 1 020 personnes, 18–21/09/2026, relayé par Comarketing-News (octobre 2026) — comarketing-news.fr/noel-2026-le-magasin-resiste-lia-sinstalle/", "ressource": "aucune.", "valider": "le retour terrain (« ce que je vois chez les enseignes ») doit correspondre à ce que Pierre constate.", "valider_par": "Pierre", "text": "82 % des Français qui préparent leurs achats de fêtes passeront par un magasin.\n\nSeuls 18 % achèteront uniquement en ligne. Et pour trouver des idées, 45 % disent qu'ils vont tout simplement se promener en magasin.\n\nOn annonce la fin du magasin tous les ans. Chaque année, à Noël, les chiffres disent l'inverse.\n\nCe que je vois chez les enseignes que je rencontre : le magasin n'a pas perdu ses clients, il a perdu le contact avec eux entre deux visites. Le client vient moins souvent, mais il vient avec une idée précise.\n\nL'enjeu n'est donc pas de faire venir « du monde ». C'est de faire venir les bonnes personnes, autour du bon magasin, au bon moment.\n\nPour vous, Noël 2026 se jouera en magasin ou en ligne ?", "media": {"type": "image", "src": "visuels/S1.png?v=8"}, "download": "visuels/S1.png?v=8", "thumb": "visuels/S1.png?v=8", "kind": "image (PNG), à ajouter comme une photo", "reply": {"by": "Pierre", "to": "Fanny", "text": "Ça dépend beaucoup, Fanny. Sur la déco ou le cadeau, on vient chercher l'idée. Sur l'équipement, on vient plutôt valider un choix déjà repéré en ligne. Dans les deux cas, le magasin a le dernier mot."}, "comments": [{"who": "Myriam Thiry", "when": "dans les 2 h", "text": "« Il a perdu le contact entre deux visites » : c'est exactement ça. Le client revient avec une idée précise, mais personne ne lui a parlé depuis son dernier passage. C'est entre deux visites que tout se joue."}, {"who": "Fanny Carrière", "when": "en fin de matinée", "text": "45 % qui vont se promener en magasin pour trouver des idées, je ne m'y attendais pas. Pierre, tu sens une différence selon le type de produit, ou c'est général ?"}, {"who": "Joanna Hede", "when": "le lendemain", "text": "Je retiens « les bonnes personnes, autour du bon magasin, au bon moment ». Le magasin reste le lieu de la décision. La vraie question, c'est ce qu'on fait pour mériter la visite."}]}, {"id": "P2", "date": "mercredi 18 novembre, 8 h 30", "title": "Un magasin sur cinq a fermé depuis 2019", "format": "visuel fixe — deux barres : « Parc de magasins : −20 % » et « Fréquentation : −13 % », et « jusqu'à −25 % de trafic sur les emplacements les moins attractifs ». Source Procos en pied.", "pourquoi": "analyse sectorielle chiffrée (format Thréard) ; Pierre pose une conviction forte sur le retail physique.", "source": "Procos, « What's next for l'évolution de l'activité du commerce spécialisé », conférence du 17/06/2026, newsletter de juillet 2026 — procos.org/images/procos/images_page_d_accueil/Newsletter/Juillet_2026/news_95_activite_commerce.pdf", "ressource": "aucune.", "valider": "", "valider_par": "", "text": "Un magasin sur cinq a fermé en France depuis 2019.\n\nC'est le chiffre présenté par Procos en juin : −20 % de magasins dans le commerce spécialisé entre 2019 et 2025. Et −13 % de fréquentation.\n\nLa moitié de ces fermetures vient de défaillances. L'autre moitié est voulue : les enseignes rationalisent leurs réseaux.\n\nCe qui m'intéresse, c'est où ça ferme. Les centres-villes et les petits centres commerciaux sont les plus touchés. Les retail parks et les meilleurs emplacements tiennent. Les emplacements les moins attractifs ont perdu près de 25 % de leur trafic.\n\nMa lecture : il n'y a pas « un » commerce physique en crise. Il y a des magasins qui ont une raison d'être visités, et d'autres qui comptent encore sur le passage.\n\nLe passage ne suffit plus. Chaque magasin doit aller chercher sa zone.\n\nDans votre réseau, quels magasins tiennent le mieux, et pourquoi ?", "media": {"type": "image", "src": "visuels/N_P2.png?v=8"}, "download": "visuels/N_P2.png?v=8", "thumb": "visuels/N_P2.png?v=8", "kind": "image (PNG), à ajouter comme une photo", "reply": {"by": "Pierre", "to": "Simon", "text": "Rarement de façon fine, Simon. On regarde le chiffre du magasin voisin après une fermeture, mais on sait peu quels clients ont suivi et lesquels sont partis. C'est pourtant là que se joue la suite."}, "comments": [{"who": "Joanna Hede", "when": "dans les 2 h", "text": "Que la moitié des fermetures soit voulue, c'est ce qui me frappe le plus. Rationaliser un réseau, c'est aussi choisir où l'on veut rester visible. Et ça demande de la donnée fine, magasin par magasin."}, {"who": "Simon Vagnier", "when": "en fin de journée", "text": "Intéressant de croiser −20 % de magasins et −13 % de fréquentation : ceux qui restent captent une partie du trafic des magasins fermés. Pierre, tu vois des enseignes mesurer ce report de clientèle ?"}, {"who": "Florence Guichard", "when": "le lendemain", "text": "« Le passage ne suffit plus » : la formule est juste. Un magasin qui compte seulement sur le flux subit son emplacement. Celui qui connaît sa zone choisit au moins qui il va chercher."}]}, {"id": "P3", "date": "mercredi 25 novembre, 8 h 30", "title": "Un réseau, ce n'est pas un marché, c'est 300 marchés", "format": "visuel fixe — 11,6 % en grand, puis trois barres de vacance 2024 : centres commerciaux 16,1 %, pieds d'immeuble 10,9 %, zones commerciales 7,2 %. Source CNC en pied.", "pourquoi": "vision locale de Pierre : les écarts entre formats et territoires justifient un pilotage magasin par magasin.", "source": "Conseil national du commerce, rapport « La vacance commerciale en centre-ville », 30/06/2026 — entreprises.gouv.fr/files/files/Entites/CNC/cnc_rapport_gt_vacance_commerciale.pdf ; Banque des Territoires (Localtis), 03/07/2026 — banquedesterritoires.fr/vacance-commerciale-il-faut-travailler-sur-lhabitabilite-des-centres-villes-souligne-le-conseil", "ressource": "aucune.", "valider": "", "valider_par": "", "text": "11,6 %. C'est le taux de vacance commerciale moyen en France en 2025. Il était de 9,5 % en 2019.\n\nMais la moyenne cache tout. En 2024, selon le même rapport :\n→ 16,1 % dans les centres commerciaux ;\n→ 10,9 % en pied d'immeuble, dans les rues commerçantes ;\n→ 7,2 % dans les zones commerciales.\n\nDeux magasins de la même enseigne peuvent vivre dans deux mondes différents. Pas le même trafic, pas les mêmes clients, pas la même concurrence à 10 minutes.\n\nC'est pour ça que je ne crois pas aux plans d'animation nationaux déclinés à l'identique dans chaque point de vente. Un réseau de 300 magasins, ce n'est pas un marché. C'est 300 marchés locaux.\n\nLa bonne question n'est pas « combien on investit cette année ? », mais « où, et pour quel magasin ? ».\n\nChez vous, le budget local se décide au siège ou en magasin ?", "media": {"type": "image", "src": "visuels/N_P3.png?v=8"}, "download": "visuels/N_P3.png?v=8", "thumb": "visuels/N_P3.png?v=8", "kind": "image (PNG), à ajouter comme une photo", "reply": {"by": "Pierre", "to": "Myriam", "text": "Souvent, ils ne le font pas, Myriam. Ou alors par un mail au régional qui se perd. Les réseaux qui s'en sortent le mieux prévoient un moment pour ça, même court, avant chaque temps fort."}, "comments": [{"who": "Simon Vagnier", "when": "dans les 2 h", "text": "300 marchés locaux, c'est aussi 300 jeux de données différents. Une moyenne nationale lisse tout ce qui compte. En analyse, on gagne presque toujours à descendre au niveau du point de vente."}, {"who": "Fanny Carrière", "when": "en fin de matinée", "text": "L'écart entre centres commerciaux et zones commerciales est frappant : plus du double. Ça confirme qu'on ne cible pas de la même façon autour de deux magasins d'une même enseigne."}, {"who": "Myriam Thiry", "when": "le lendemain", "text": "Une question sur ton dernier point, Pierre : quand le budget se décide au siège, comment les directeurs de magasin font-ils remonter ce qu'ils savent de leur zone ?"}]}, {"id": "P4", "date": "mercredi 2 décembre, 8 h 30", "title": "5 choses que j'ai apprises en parlant avec des directeurs de magasin", "format": "visuel fixe — liste de cinq leçons numérotées, en grand.", "pourquoi": "format « liste de leçons » et retour terrain (Thréard) ; Pierre parle de ses rendez-vous, sans nommer personne et sans vendre.", "source": "aucune (retour terrain).", "ressource": "aucune.", "valider": "les cinq leçons doivent être les siennes ; à reformuler avec ses mots et ses exemples.", "valider_par": "Pierre", "text": "Ce que j'ai appris en parlant avec des directeurs de magasin. Cinq choses.\n\n1. Ils connaissent leur zone mieux que n'importe quel tableau de bord. Demandez-leur d'où viennent leurs clients : ils vous répondent rue par rue.\n\n2. Le premier frein n'est pas le budget. C'est le temps. Une action locale qui leur demande trois réunions ne se fera pas.\n\n3. Ils veulent un résultat par magasin. Un bilan national ne leur dit rien sur leur propre point de vente.\n\n4. Le samedi ne se prépare pas le vendredi. Ceux qui remplissent leur magasin travaillent leur zone dix jours avant.\n\n5. Ils se méfient des promesses. Ils font confiance à ce qu'ils voient en caisse.\n\nSi je devais n'en garder qu'une : partir du magasin, pas de la campagne.\n\nDirecteurs de magasin, qu'est-ce que j'ai oublié ?", "media": {"type": "image", "src": "visuels/N_P4.png?v=8"}, "download": "visuels/N_P4.png?v=8", "thumb": "visuels/N_P4.png?v=8", "kind": "image (PNG), à ajouter comme une photo", "reply": {"by": "Pierre", "to": "Myriam", "text": "Belle sixième leçon, Myriam. Les meilleurs parlent de « la cliente qui vient tous les samedis » plutôt que d'un segment. Je la garde pour la prochaine liste."}, "comments": [{"who": "Joanna Hede", "when": "dans les 2 h", "text": "Le point 2 me parle beaucoup. On sous-estime le temps d'un directeur de magasin. Une bonne idée qui demande trois réunions perd face à une idée moyenne qui se lance en un coup de fil."}, {"who": "Myriam Thiry", "when": "en fin de journée", "text": "J'en ajouterais une sixième : ils connaissent leurs clients par leur prénom, pas par leur segment. Une action qui leur parle de vrais clients les intéresse plus qu'un tableau."}, {"who": "Fanny Carrière", "when": "le lendemain", "text": "Pour moi, le point 5 est le plus honnête. Ce qui se voit en caisse, c'est ce qui compte pour eux. Pierre, comment fais-tu le lien entre une action et ce que le magasin constate vraiment ?"}]}, {"id": "P5", "date": "mercredi 9 décembre, 8 h 30", "title": "Ressource : votre zone de chalandise en 6 questions", "format": "carrousel PDF 8 pages — couverture, six questions (une par page), page finale « Envoyez-moi un message, je vous envoie la grille ».", "pourquoi": "ressource gratuite (le lead magnet du modèle Thréard), utile à un directeur de magasin ou de réseau, sans produit Live Data.", "source": "aucune.", "ressource": "la grille « zone de chalandise en 6 questions », envoyée par message à ceux qui la demandent.", "valider": "", "valider_par": "", "text": "Votre magasin a une zone de chalandise. Mais la connaissez-vous vraiment ?\n\nSix questions que je pose avant de parler de n'importe quelle action locale :\n\n1. Jusqu'où vos clients viennent-ils, en minutes de trajet, pas en kilomètres ?\n2. Combien d'habitants vivent dans cette zone ?\n3. Quelle part de vos clients habite vraiment autour du magasin ?\n4. Où sont vos concurrents, à moins de 10 minutes ?\n5. Qui, dans la zone, ne vous connaît pas encore ?\n6. Comment saurez-vous qu'une action a fait venir du monde en magasin ?\n\nSi vous répondez à la sixième avant de lancer l'action, vous avez déjà une longueur d'avance.\n\nJ'ai mis ces questions dans une grille d'une page. Si elle vous est utile, envoyez-moi un message, je vous l'envoie.", "media": {"type": "carousel", "pages": ["carrousels/pages/N_P5-01.png?v=8", "carrousels/pages/N_P5-02.png?v=8", "carrousels/pages/N_P5-03.png?v=8", "carrousels/pages/N_P5-04.png?v=8", "carrousels/pages/N_P5-05.png?v=8", "carrousels/pages/N_P5-06.png?v=8", "carrousels/pages/N_P5-07.png?v=8", "carrousels/pages/N_P5-08.png?v=8"]}, "download": "carrousels/N_P5.pdf?v=8", "thumb": "carrousels/pages/N_P5-01.png?v=8", "kind": "carrousel (PDF de 8 pages), à ajouter comme un document", "reply": {"by": "Pierre", "to": "Florence", "text": "Bonne remarque, Florence. Je conseille de partir des clients venus dans les douze derniers mois, plutôt que de toute la base fidélité. On a une image plus juste de la zone telle qu'elle est aujourd'hui."}, "comments": [{"who": "Simon Vagnier", "when": "dans les 2 h", "text": "La question 1 change tout. Dix kilomètres en périphérie et dix kilomètres en centre-ville, ce n'est pas la même zone. Le temps de trajet colle bien mieux à la réalité du client."}, {"who": "Fanny Carrière", "when": "en fin de journée", "text": "Ma préférée, c'est la question 5. Ceux qui ne vous connaissent pas encore sont souvent plus nombreux qu'on le croit, et ils habitent tout près. Grille simple, utile dès la première lecture."}, {"who": "Florence Guichard", "when": "le lendemain", "text": "Sur la question 3, attention à la base utilisée. Des adresses de fidélité anciennes ou mal remplies faussent toute la lecture de la zone. Pierre, tu conseilles de partir de quels clients ?"}]}]}, {"key": "S", "name": "Simon Vagnier", "first": "Simon", "role": "Directeur Business Unit", "photo": "assets/simon.jpg?v=8", "headline": "Directeur Business Unit · Live Data Solutions", "topics": "Data, ciblages, IA dans la data", "posts": [{"id": "S1", "date": "jeudi 12 novembre, 9 h", "title": "Actu : l'IA ne répare pas une base sale", "format": "schéma fixe (repris de la V5) — « base sale → IA → décisions fausses ».", "pourquoi": "sujet de Simon (IA dans la data) ; actu chiffrée sourcée, puis conviction et trois questions concrètes.", "source": "Adobe, rapport « IA et tendances digitales 2026 », 7 000 répondants, relayé par J'ai un pote dans la com, 04/03/2026 — jai-un-pote-dans-la.com/rapport-adobe-2026-ia-agentique-adoption-france/", "ressource": "aucune.", "valider": "", "valider_par": "", "text": "78 % des entreprises françaises citent l'intégration et la qualité des données comme le premier frein pour passer à l'échelle avec l'IA agentique.\n\nEt seules 36 % jugent leurs données suffisantes pour l'IA aujourd'hui.\n\nCe chiffre ne me surprend pas. On achète l'outil d'abord, on regarde la donnée ensuite.\n\nLe problème : l'IA ne répare pas une base sale. Un modèle qui apprend sur des emails périmés, des doublons et des consentements introuvables produit des décisions fausses. Plus vite, et avec plus d'assurance.\n\nAvant n'importe quel projet d'IA, je poserais trois questions :\n→ Quelle part de ma base est réellement joignable ?\n→ Pour quels canaux ai-je la preuve du consentement ?\n→ Quand ces données ont-elles été vérifiées pour la dernière fois ?\n\nSi les réponses sont floues, votre premier projet d'IA, c'est celui-là.\n\nVous avez commencé par l'outil ou par la donnée ?", "media": {"type": "image", "src": "visuels/J3.png?v=8"}, "download": "visuels/J3.png?v=8", "thumb": "visuels/J3.png?v=8", "kind": "image (PNG), à ajouter comme une photo", "reply": {"by": "Simon", "to": "Fanny", "text": "Exactement, Fanny. La date de la donnée manque presque toujours dans les projets d'IA que je vois passer. C'est pourtant l'information la plus simple à ajouter."}, "comments": [{"who": "Joanna Hede", "when": "dans les 2 h", "text": "Seules 36 % jugent leurs données suffisantes : en comité de direction, ce chiffre devrait passer avant le choix de l'outil. Sinon, on achète un moteur sans carburant."}, {"who": "Fanny Carrière", "when": "en fin de matinée", "text": "En analyse, je le vois tous les jours : un modèle ne fait pas la différence entre une donnée fraîche et une donnée de cinq ans. Il les traite avec la même confiance. Le vrai risque est là."}, {"who": "Florence Guichard", "when": "le lendemain", "text": "Ta deuxième question est souvent la plus difficile. Avoir un consentement ne suffit pas, il faut savoir pour quel canal et quel usage. Une IA qui active des contacts sans cette nuance crée un risque, pas de la performance."}]}, {"id": "S2", "date": "jeudi 19 novembre, 9 h", "title": "Un intentionniste a une date de péremption", "format": "animation 12 s (reprise de la V5) — une frise : le signal d'intention s'allume, une fenêtre se colore, le message arrive dedans ; une seconde version arrive trois semaines plus tard, la fenêtre est fermée.", "pourquoi": "sujet ciblages de Simon ; conviction claire, idée à retenir en une phrase, sans produit.", "source": "aucune (conviction).", "ressource": "aucune.", "valider": "", "valider_par": "", "text": "Un intentionniste, c'est quelqu'un qui est en train de chercher. Pas quelqu'un qui a cherché.\n\nUne personne qui compare des assurances habitation parce qu'elle déménage a un projet pour quelques semaines. Après, elle a signé. Chez quelqu'un d'autre, si on arrive trop tard.\n\nC'est pour ça que, sur un ciblage intentionniste, je regarde trois choses avant le volume :\n→ quel signal a été détecté ;\n→ quand il a été détecté ;\n→ en combien de temps le message peut partir.\n\nUn fichier de « personnes intéressées par l'assurance » sans date, ce n'est pas de l'intention. C'est un souvenir.\n\nDans vos ciblages, vous regardez la date du signal ?", "media": {"type": "video", "src": "anim/F2.mp4?v=8", "poster": "anim/F2.png?v=8"}, "download": "anim/F2.mp4?v=8", "thumb": "anim/F2.png?v=8", "kind": "animation (vidéo MP4), à ajouter comme une vidéo", "reply": {"by": "Simon", "to": "Myriam", "text": "Ça dépend du projet, Myriam. Pour un déménagement ou une assurance, on parle de quelques semaines. Pour une voiture, un peu plus. Le bon réflexe : fixer la fenêtre avant la campagne, pas après."}, "comments": [{"who": "Fanny Carrière", "when": "dans l'heure", "text": "« Ce n'est pas de l'intention, c'est un souvenir » : je la garde. On voit encore des ciblages vendus sur une intention sans date. La fraîcheur du signal devrait être une colonne obligatoire."}, {"who": "Pierre Sadain", "when": "en fin de journée", "text": "Même logique en retail : quelqu'un qui cherche un canapé aujourd'hui l'aura acheté dans quelques semaines. Arriver après, c'est parler à quelqu'un qui a déjà choisi."}, {"who": "Myriam Thiry", "when": "le lendemain", "text": "La règle vaut aussi en réactivation : un client qui a regardé votre site hier n'est pas le même que celui qui l'a fait il y a six mois. Simon, quelle fenêtre te semble raisonnable ?"}]}, {"id": "S3", "date": "jeudi 26 novembre, 9 h", "title": "Les 3 familles de signaux d'intention", "format": "schéma fixe en trois colonnes (repris de la V5) — déclaratif, comportemental, moment de vie.", "pourquoi": "contenu pédagogique et enregistrable sur le ciblage, le cœur du sujet de Simon.", "source": "aucune.", "ressource": "aucune.", "valider": "", "valider_par": "", "text": "Tous les signaux d'intention ne se valent pas.\n\nQuand on prépare un ciblage, je distingue trois familles :\n\n→ le déclaratif : la personne le dit elle-même, dans un formulaire ou un questionnaire. C'est le plus explicite.\n→ le comportemental : elle le montre, par ses recherches ou ses comparaisons. C'est souvent le plus frais.\n→ le moment de vie : elle le vit. Un déménagement, une naissance, un nouveau véhicule. C'est celui qui ouvre le plus de besoins à la fois.\n\nLe meilleur ciblage croise souvent les trois. Et pour chacun, une question reste la même : depuis quand le sait-on ?\n\nLequel de ces signaux utilisez-vous aujourd'hui ?", "media": {"type": "image", "src": "visuels/F3.png?v=8"}, "download": "visuels/F3.png?v=8", "thumb": "visuels/F3.png?v=8", "kind": "image (PNG), à ajouter comme une photo", "reply": {"by": "Simon", "to": "Joanna", "text": "Oui, c'est le plus périssable. Une recherche, c'est souvent une affaire de jours. Le moment de vie tient plus longtemps, et le déclaratif dépend de la question posée. D'où la date, toujours."}, "comments": [{"who": "Florence Guichard", "when": "dans les 2 h", "text": "Le déclaratif a un avantage souvent oublié : c'est le plus simple à justifier. La personne l'a dit elle-même, on sait quand et où. Dans les secteurs régulés, ça compte beaucoup."}, {"who": "Pierre Sadain", "when": "en fin de journée", "text": "Pour un magasin, le moment de vie est souvent le plus parlant. Quelqu'un qui vient d'emménager dans la zone est un client potentiel qui ne connaît encore aucune adresse autour de chez lui."}, {"who": "Joanna Hede", "when": "le lendemain", "text": "Belle synthèse. Simon, lequel des trois vieillit le plus vite selon toi ? J'ai l'impression que le comportemental perd sa valeur en quelques jours."}]}, {"id": "S4", "date": "jeudi 3 décembre, 9 h", "title": "Ventes attribuées ou ventes gagnées ?", "format": "schéma fixe (repris de la V5) — deux colonnes : « ventes attribuées à la campagne » et « ventes réellement gagnées grâce à elle », l'écart marqué « ce qui serait arrivé de toute façon ». Sans chiffres.", "pourquoi": "optimisation de l'usage de la donnée : la mesure qui dit vraiment ce que la donnée a rapporté.", "source": "aucune.", "ressource": "aucune.", "valider": "", "valider_par": "", "text": "La question que je pose sur chaque campagne : qu'est-ce qui ne se serait pas passé sans elle ?\n\nUne campagne peut afficher de très beaux résultats en ne recrutant presque personne. Il suffit qu'elle touche des clients qui seraient venus de toute façon.\n\nLes tableaux de bord attribuent tout au dernier message reçu. C'est confortable, mais ça ne dit pas ce que la campagne a vraiment rapporté.\n\nLa méthode est simple :\n→ mettre de côté 5 à 10 % de la cible, tirés au hasard ;\n→ ne pas les contacter ;\n→ comparer ensuite les deux groupes.\n\nL'écart, c'est le vrai effet. C'est moins flatteur. C'est la seule base solide pour décider du budget suivant.\n\nChez vous, on parle de ventes attribuées ou de ventes gagnées ?", "media": {"type": "image", "src": "visuels/J4.png?v=8"}, "download": "visuels/J4.png?v=8", "thumb": "visuels/J4.png?v=8", "kind": "image (PNG), à ajouter comme une photo", "reply": {"by": "Simon", "to": "Pierre", "text": "Bonne question, Pierre. Sur une petite cible, l'écart est plus fragile. On peut regrouper plusieurs magasins comparables, ou répéter la mesure sur plusieurs vagues. L'important, c'est de ne pas conclure sur une seule."}, "comments": [{"who": "Myriam Thiry", "when": "dans les 2 h", "text": "Le groupe témoin, je le recommande sur toutes les campagnes de réactivation. Les clients fidèles qui allaient revenir de toute façon gonflent les résultats. Sans témoin, on paie pour eux."}, {"who": "Pierre Sadain", "when": "en fin de journée", "text": "Une question pratique : sur une campagne locale autour d'un seul magasin, la cible est parfois petite. Mettre 5 à 10 % de côté, ça suffit encore pour mesurer quelque chose ?"}, {"who": "Fanny Carrière", "when": "le lendemain", "text": "Moins flatteur, mais tellement plus utile. Le jour où on compare deux campagnes avec chacune son témoin, l'ordre des priorités budgétaires change souvent du tout au tout."}]}, {"id": "S5", "date": "jeudi 10 décembre, 9 h", "title": "Ressource : 5 questions à poser à un fournisseur de données", "format": "carrousel PDF 7 pages (repris de la V5) — couverture, cinq questions, page finale.", "pourquoi": "format le plus enregistré ; Simon donne une grille utile à tout acheteur de données, y compris face à son propre métier.", "source": "aucune.", "ressource": "la grille en PDF, envoyée par message à ceux qui la demandent.", "valider": "", "valider_par": "", "text": "Cinq questions à poser à n'importe quel fournisseur de données. Le nôtre compris.\n\n1. D'où viennent vos contacts, source par source ?\n2. Pouvez-vous me montrer la preuve du consentement d'un contact pris au hasard ?\n3. Combien de fois par mois un même contact est-il sollicité ?\n4. Où sont hébergées les données ?\n5. Comment mesurez-vous ce que la campagne a réellement rapporté ?\n\nSi l'une des réponses est floue, c'est un signal.\n\nJ'en ai fait une grille d'une page. Si elle vous sert, envoyez-moi un message.\n\nIl manque une question à cette liste ?", "media": {"type": "carousel", "pages": ["carrousels/pages/J5-01.png?v=8", "carrousels/pages/J5-02.png?v=8", "carrousels/pages/J5-03.png?v=8", "carrousels/pages/J5-04.png?v=8", "carrousels/pages/J5-05.png?v=8", "carrousels/pages/J5-06.png?v=8", "carrousels/pages/J5-07.png?v=8"]}, "download": "carrousels/J5.pdf?v=8", "thumb": "carrousels/pages/J5-01.png?v=8", "kind": "carrousel (PDF de 7 pages), à ajouter comme un document", "reply": {"by": "Simon", "to": "Florence", "text": "Très bonne sixième question, Florence. La façon de traiter une demande de suppression dit tout du sérieux d'une base. Je l'ajoute à la grille."}, "comments": [{"who": "Florence Guichard", "when": "dans les 2 h", "text": "J'ajouterais une question : que se passe-t-il quand un contact demande à être supprimé ? La réponse en dit long sur la façon dont le fournisseur tient sa base au quotidien."}, {"who": "Joanna Hede", "when": "en fin de journée", "text": "« Le nôtre compris » : c'est la bonne posture. Un acheteur qui pose ces cinq questions protège son entreprise, et il fait monter le niveau de tout le marché."}, {"who": "Pierre Sadain", "when": "le lendemain", "text": "La question 3 parle aussi aux enseignes. Un client sollicité trop souvent finit par ignorer tout le monde, y compris le magasin de son quartier."}]}]}, {"key": "L", "name": "Live Data Solutions", "first": "Page Live Data", "role": "Page entreprise", "photo": "assets/logo_lds_sq.png?v=8", "headline": "Page entreprise · solutions et produits", "topics": "Solutions et produits", "posts": [{"id": "L1", "date": "jeudi 12 novembre, 11 h", "title": "Opérateur data : ce qu'on fait vraiment", "format": "schéma fixe en 3 étapes (repris de la V5) — Choisir qui contacter → Activer, quand et sur quel canal → Prouver ce que ça a rapporté.", "pourquoi": "post de présentation de la page : le positionnement d'opérateur data, avec les deux chiffres autorisés (38M+, depuis 2014).", "source": "chiffres Live Data Solutions (38M+ contacts opt-in, créée en 2014).", "ressource": "aucune.", "valider": "", "valider_par": "", "text": "« Vous vendez de la data ? » Non.\n\nLive Data Solutions est un opérateur data. Depuis 2014, notre métier tient en trois étapes :\n\n→ Choisir qui contacter : plus de 38 millions de contacts opt-in en France, en BtoC et en BtoB, ciblés par zone, profil, intention ou moment de vie.\n→ Activer, au bon moment et sur le bon canal : email, SMS et RCS, téléphone, courrier, display.\n→ Prouver ce que ça a rapporté : un bilan campagne par campagne, et magasin par magasin quand c'est utile.\n\nLa donnée n'est que la matière première. Ce qui compte, c'est ce qu'elle déclenche.\n\nUn projet de conquête ou de réactivation ? Parlons-en.", "media": {"type": "image", "src": "visuels/S2.png?v=8"}, "download": "visuels/S2.png?v=8", "thumb": "visuels/S2.png?v=8", "kind": "image (PNG), à ajouter comme une photo", "reply": {"by": "Live Data Solutions", "to": "Pierre", "text": "Merci Pierre. C'est souvent ce qui fait la différence pour la décision suivante : un résultat que le directeur de magasin reconnaît comme le sien."}, "comments": [{"who": "Joanna Hede", "when": "dans les 2 h", "text": "Douze ans après la création, la troisième étape reste celle dont je suis la plus fière : prouver ce que la campagne a rapporté. C'est elle qui fait revenir les clients."}, {"who": "Pierre Sadain", "when": "en fin de matinée", "text": "Côté magasins, le bilan point de vente par point de vente change la conversation avec les directeurs. Ils voient enfin ce qui s'est passé chez eux, pas une moyenne."}, {"who": "Myriam Thiry", "when": "le lendemain", "text": "Tout est dans cette phrase : la donnée n'est que la matière première. Les échanges les plus intéressants commencent quand on parle de ce qu'on veut déclencher, pas de volumes."}]}, {"id": "L2", "date": "mercredi 18 novembre, 11 h", "title": "Le comptage : combien de personnes vous pouvez vraiment toucher", "format": "animation 12 s (reprise de la V5) — un entonnoir en cinq étages : habitants de la zone → profil recherché → réellement joignables → accord pour le canal → hors clients actuels.", "pourquoi": "présente la plateforme de comptage et la méthode de chiffrage, de façon transparente.", "source": "aucune (description de l'offre, contexte Live Data Solutions).", "ressource": "comptage de la zone d'un magasin, sur demande.", "valider": "", "valider_par": "", "text": "« Combien de personnes je peux toucher ? »\n\nC'est la première question qu'on nous pose. Notre réponse ressemble à un entonnoir :\n→ combien de personnes habitent la zone ;\n→ combien correspondent au profil recherché ;\n→ combien sont réellement joignables ;\n→ combien ont donné leur accord pour le canal choisi ;\n→ combien restent une fois vos clients actuels retirés.\n\nC'est la dernière ligne qui compte, pour le budget comme pour le bilan.\n\nNotre plateforme de comptage chiffre chaque étage en temps réel. Elle peut aussi être déployée en marque blanche pour les agences, formation incluse.\n\nVous voulez le comptage de votre zone ? Écrivez-nous.", "media": {"type": "video", "src": "anim/F4.mp4?v=8", "poster": "anim/F4.png?v=8"}, "download": "anim/F4.mp4?v=8", "thumb": "anim/F4.png?v=8", "kind": "animation (vidéo MP4), à ajouter comme une vidéo", "reply": {"by": "Live Data Solutions", "to": "Fanny", "text": "Exactement, Fanny. C'est pour ça que cette ligne ferme l'entonnoir : c'est elle qui donne le vrai potentiel de conquête."}, "comments": [{"who": "Simon Vagnier", "when": "dans les 2 h", "text": "La quatrième ligne, l'accord pour le canal, est celle qu'on oublie le plus. C'est elle qui sépare un volume théorique d'un volume qu'on peut réellement activer."}, {"who": "Pierre Sadain", "when": "en fin de journée", "text": "C'est la première question que me posent les enseignes. Montrer l'entonnoir étage par étage évite les mauvaises surprises au moment du bilan."}, {"who": "Fanny Carrière", "when": "le lendemain", "text": "Retirer les clients actuels paraît évident, et pourtant c'est l'étape qu'on saute le plus souvent. Sans elle, une campagne de conquête parle en partie à des gens déjà clients."}]}, {"id": "L3", "date": "jeudi 26 novembre, 11 h (veille du Black Friday)", "title": "Instant Mail® : ×2 sur le taux d'ouverture", "format": "animation 12 s (reprise de la V5) — deux boîtes mail : envoi à heure fixe, noyé dans la pile ; Instant Mail®, arrivé au moment où la personne se connecte, en haut. Puis « ×2 ».", "pourquoi": "preuve produit publiée au moment où les boîtes mail débordent.", "source": "chiffres internes Live Data Solutions 2026, mesurés par rapport à un routage à heure fixe.", "ressource": "aucune.", "valider": "", "valider_par": "", "text": "Même email. Même cible. Deux fois plus d'ouvertures.\n\nLa seule différence, c'est le moment de l'envoi.\n\nUne campagne classique part à heure fixe : mardi 10 h, pour tout le monde. Instant Mail® envoie l'email au moment où la personne est connectée.\n\nRésultat mesuré sur nos campagnes : un taux d'ouverture multiplié par deux par rapport à un envoi à heure fixe.\n\nDemain, c'est le Black Friday. Les boîtes mail vont déborder. Arriver au bon moment vaudra plus qu'un bon objet.", "media": {"type": "video", "src": "anim/S4.mp4?v=8", "poster": "anim/S4.png?v=8"}, "download": "anim/S4.mp4?v=8", "thumb": "anim/S4.png?v=8", "kind": "animation (vidéo MP4), à ajouter comme une vidéo", "reply": {"by": "Live Data Solutions", "to": "Simon", "text": "Merci Simon. C'est la condition pour que le ×2 veuille dire quelque chose : une seule différence entre les deux envois."}, "comments": [{"who": "Joanna Hede", "when": "dans les 2 h", "text": "Le bon moment compte souvent autant que le bon message. Cette semaine plus que jamais, quand chaque boîte mail se remplit de promotions dès le matin."}, {"who": "Simon Vagnier", "when": "en fin de journée", "text": "Ce que j'aime dans ce test : même email, même cible. Une seule variable change, le moment de l'envoi. C'est comme ça qu'on mesure proprement un effet."}, {"who": "Florence Guichard", "when": "le lendemain", "text": "Les annonceurs en banque et assurance me demandent souvent quel est le meilleur créneau d'envoi. Ce résultat le montre bien : il n'y a pas de bonne heure fixe, seulement un bon moment pour chaque personne."}]}, {"id": "L4", "date": "mercredi 2 décembre, 11 h", "title": "Le RCS est prêt : 84 % des smartphones compatibles", "format": "visuel fixe (nouveau, d'après celui de la V5) — deux chiffres face à face : « 84 % des smartphones compatibles RCS » et « 738 marques l'ont utilisé en 2025 », avec un SMS texte à côté d'un message RCS (image, boutons).", "pourquoi": "innovation canal, chiffres af2m récents ; présente Instant RCS avec le chiffre autorisé.", "source": "af2m, Baromètre du marketing SMS 2025, publié le 25/02/2026 — af2m.org/barometre-du-marketing-sms-2025/ ; chiffres internes Live Data Solutions 2026 (Instant RCS).", "ressource": "aucune.", "valider": "", "valider_par": "", "text": "84 % des smartphones en France peuvent recevoir du RCS. 52 millions d'appareils.\n\nEn 2025, 738 marques l'ont utilisé, 75 % de plus qu'en 2024. Le retail représente 18 % d'entre elles.\n\nLe RCS, c'est un SMS avec des images, des boutons et des carrousels. Pour une offre en magasin, on montre le produit, l'adresse et l'itinéraire dans le même message.\n\nAvec Instant RCS, le message part au moment où la personne est connectée : 75 % de taux d'ouverture sur nos campagnes.\n\nNotre conseil : tester sur une partie de votre cible SMS, avec la même offre, et comparer.\n\nVous avez déjà testé le RCS ?", "media": {"type": "image", "src": "visuels/N_L4.png?v=8"}, "download": "visuels/N_L4.png?v=8", "thumb": "visuels/N_L4.png?v=8", "kind": "image (PNG), à ajouter comme une photo", "reply": {"by": "Live Data Solutions", "to": "Joanna", "text": "Oui, et un premier test sert surtout à apprendre ce qui marche pour sa propre cible : le visuel, les boutons, le moment."}, "comments": [{"who": "Pierre Sadain", "when": "dans les 2 h", "text": "Pour le retail, montrer le produit, l'adresse et l'itinéraire dans le même message, ça change beaucoup. Le client n'a plus à chercher où se trouve le magasin le plus proche."}, {"who": "Joanna Hede", "when": "en fin de matinée", "text": "Le chiffre qui me frappe : 75 % de marques en plus en un an. Le RCS sort de la phase d'essai. Ceux qui testent maintenant auront une longueur d'avance."}, {"who": "Simon Vagnier", "when": "le lendemain", "text": "Le conseil de la fin est le bon : même offre, une partie de la cible en RCS, l'autre en SMS. Sans comparaison, impossible de savoir ce que le format apporte vraiment."}]}, {"id": "L5", "date": "mercredi 9 décembre, 11 h", "title": "Agences : nos 3 règles de partenariat", "format": "carrousel PDF 5 pages (repris de la V5).", "pourquoi": "les agences sont des prescripteurs ; le post présente les modèles de partenariat (marque blanche, non-sollicitation).", "source": "aucune (modèles de partenariat Live Data Solutions).", "ressource": "aucune.", "valider": "", "valider_par": "", "text": "Une agence ne devrait jamais avoir peur de présenter un partenaire data à son client.\n\nQuand on travaille avec une agence, on pose trois règles dès le premier jour :\n→ l'agence garde la relation client ;\n→ on peut opérer en marque blanche : son client ne voit qu'elle ;\n→ on s'engage par contrat à ne pas solliciter ses clients.\n\nMarque blanche, co-traitance ou apport d'affaires : le modèle s'adapte à l'agence, pas l'inverse.\n\nAgences : qu'est-ce qui vous retient de travailler avec un opérateur data ?", "media": {"type": "carousel", "pages": ["carrousels/pages/S3-01.png?v=8", "carrousels/pages/S3-02.png?v=8", "carrousels/pages/S3-03.png?v=8", "carrousels/pages/S3-04.png?v=8", "carrousels/pages/S3-05.png?v=8"]}, "download": "carrousels/S3.pdf?v=8", "thumb": "carrousels/pages/S3-01.png?v=8", "kind": "carrousel (PDF de 5 pages), à ajouter comme un document", "reply": {"by": "Live Data Solutions", "to": "Pierre", "text": "Merci Pierre. C'est pour ça qu'on l'écrit dans le contrat dès le premier jour, et pas seulement dans une présentation."}, "comments": [{"who": "Pierre Sadain", "when": "dans les 2 h", "text": "La non-sollicitation écrite dans le contrat, c'est souvent la première question des agences avec qui j'échange. La voir posée dès le départ change le ton de la discussion."}, {"who": "Simon Vagnier", "when": "en fin de journée", "text": "La marque blanche est souvent mal comprise. Ce n'est pas se cacher, c'est laisser l'agence au centre de la relation : elle garde la main, on apporte la donnée et l'exécution."}, {"who": "Joanna Hede", "when": "le lendemain", "text": "Une conviction depuis le début : on grandit avec les agences, pas à côté d'elles. Ces trois règles le disent noir sur blanc."}]}]}], "team": [{"name": "Joanna Hede", "first": "Joanna", "role": "CEO", "photo": "assets/joanna.jpg?v=8"}, {"name": "Pierre Sadain", "first": "Pierre", "role": "Sales Manager", "photo": "assets/pierre.jpg?v=8"}, {"name": "Simon Vagnier", "first": "Simon", "role": "Directeur Business Unit", "photo": "assets/simon.jpg?v=8"}, {"name": "Myriam Thiry", "first": "Myriam", "role": "Sales Manager", "photo": ""}, {"name": "Fanny Carrière", "first": "Fanny", "role": "Directrice de clientèle eCRM", "photo": "assets/fanny.jpg?v=8"}, {"name": "Florence Guichard", "first": "Florence", "role": "Directrice de clientèle eCRM", "photo": "assets/florence.jpg?v=8"}], "weeks": [{"w": "S46", "span": "9 → 13 nov.", "start": "2026-11-09", "ids": ["J1", "P1", "S1", "L1"]}, {"w": "S47", "span": "16 → 20 nov.", "start": "2026-11-16", "ids": ["J2", "P2", "S2", "L2"]}, {"w": "S48", "span": "23 → 27 nov.", "start": "2026-11-23", "ids": ["J3", "P3", "S3", "L3"]}, {"w": "S49", "span": "30 nov. → 4 déc.", "start": "2026-11-30", "ids": ["J4", "P4", "S4", "L4"]}, {"w": "S50", "span": "7 → 11 déc.", "start": "2026-12-07", "ids": ["J5", "P5", "S5", "L5"]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s).replace(/\b((?:[a-z0-9-]+\.)+(?:com|fr)(?:\/[^\s—]*)?)/gi, m => {
  const u = m.replace(/[.,;)]+$/, ''); const rest = m.slice(u.length);
  return `<a href="https://${u}" target="_blank" rel="noopener">${u}</a>${rest}`; });
const isNone = s => !s || /^aucune/i.test(s);
const POSTS = {}, PER = {};
DATA.people.forEach(per => { PER[per.key] = per; per.posts.forEach((p, i) => { p.k = per.key; p.n = i + 1; POSTS[p.id] = p; }); });
const shortDate = d => d.split(' (')[0];
const status = p => p.valider ? (/juridique/i.test(p.valider) ? 'À valider juridiquement' : 'À valider par ' + p.valider_par) : '';
const typeLabel = p => p.media.type === 'video' ? 'Animation' : p.media.type === 'carousel' ? `Carrousel ${p.media.pages.length} p.` : 'Image';
const perLabel = per => per.key === 'L' ? 'Page Live Data' : per.name;
const BASE = 'Programme LinkedIn Live Data — pilote';
const TEAM = {}; DATA.team.forEach(t => TEAM[t.name] = t);
const initials = n => n.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
const avatar = (name, photo) => photo ? `<img class="av" src="${photo}" alt="">` : `<span class="av" aria-hidden="true">${initials(name)}</span>`;
const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function comment(p, i, withPost){
  const c = p.comments[i], t = TEAM[c.who];
  return `<div class="co">${avatar(c.who, t.photo)}<div><span class="cn">${esc(c.who)}<span class="cw">${esc(c.when)}</span><span class="cr">${esc(t.role)}${withPost ? ` · sur <a class="pl" href="#${p.id}">${p.id} · ${esc(PER[p.k].first)} — ${esc(p.title)}</a>` : ''}</span></span>
   <p>${esc(c.text)}</p><button class="btn sm copyc" type="button" data-id="${p.id}" data-i="${i}">Copier</button></div></div>`;
}
function replyHtml(p){
  const r = p.reply, per = PER[p.k];
  return `<div class="co rp">${avatar(per.name, per.photo)}<div><span class="cn">${esc(r.by)}<span class="cw">réponse type, à ${esc(r.to.split(' ')[0])}</span><span class="cr">Auteur du post</span></span>
   <p>${esc(r.text)}</p><button class="btn sm copyr" type="button" data-id="${p.id}">Copier</button></div></div>`;
}
function cmtBlock(p){
  return `<details class="cmt" id="cmt-${p.id}"><summary><span>Commentaires proposés pour l'équipe<small>${p.comments.length} propositions + 1 réponse type de l'auteur</small></span></summary><div class="cb">
   <p class="hint">À réécrire avec vos mots, au moment indiqué. Règles : <a href="#commenter">Commenter les posts des collègues</a>.</p>
   ${p.comments.map((c, i) => comment(p, i, false)).join('')}
   <p class="hint"><b>Réponse type de l'auteur</b> (l'algorithme valorise les fils de discussion) :</p>${replyHtml(p)}</div></details>`;
}
function commentsView(first){
  const all = Object.values(POSTS);
  const sel = DATA.team.find(t => slug(t.first) === first);
  const items = [];
  all.forEach(p => p.comments.forEach((c, i) => { if (!sel || c.who === sel.name) items.push([p, i]); }));
  const fl = `<nav class="flt" aria-label="Filtrer par collègue"><a href="#commentaires"${sel ? '' : ' aria-current="true"'}>Tous</a>${DATA.team.map(t => `<a href="#commentaires-${slug(t.first)}"${sel && sel.name === t.name ? ' aria-current="true"' : ''}>${avatar(t.name, t.photo)}${esc(t.first)}</a>`).join('')}</nav>`;
  return `<h1 class="v" tabindex="-1">${sel ? 'Mes commentaires — ' + esc(sel.first) : 'Commentaires proposés'}</h1>
   <p class="lead">${items.length} propositions${sel ? ' pour ' + esc(sel.first) : ', 3 par post'}, dans l'ordre des posts. À réécrire avec vos mots ; règles dans <a href="#commenter">Commenter les posts des collègues</a>.</p>
   ${fl}<div class="mlist">${items.map(([p, i]) => comment(p, i, true)).join('')}</div>`;
}

function pcard(p, showWho){
  const per = PER[p.k], st = status(p);
  return `<a class="pc" href="#${p.id}">
   <span class="th"><img src="${p.thumb}" alt="" loading="lazy"><span class="ty">${typeLabel(p)}</span></span>
   <span class="pb">${showWho ? `<span class="pw"><img src="${per.photo}" alt="">${esc(per.first)}</span>` : ''}
    <span class="pm"><b>${p.id}</b> · ${esc(shortDate(p.date)).replace(/(\d+ h(?: \d+)?)$/, '<span style="white-space:nowrap">$1</span>')}</span>
    <span class="pt">${esc(p.title)}</span>
    ${st ? `<span class="st">${st}</span>` : ''}
    <span class="cc">${p.comments.length} commentaires proposés</span>
    <span class="op">Ouvrir le post ›</span></span></a>`;
}

function media(p){
  const m = p.media;
  if (m.type === 'image') return `<div class="media"><img src="${m.src}" alt="Visuel ${p.id}" onerror="this.parentNode.classList.add('err')"><div class="missing">Visuel ${p.id} introuvable</div></div>`;
  if (m.type === 'video') return `<div class="media"><video src="${m.src}" poster="${m.poster}" autoplay muted loop playsinline preload="auto" onerror="this.parentNode.classList.add('err')"></video><div class="missing">Animation ${p.id} introuvable</div></div>`;
  const n = m.pages.length;
  return `<div class="media caro" data-i="0" data-n="${n}"><div class="track">${m.pages.map((s,i)=>`<img src="${s}" alt="Page ${i+1} sur ${n}">`).join('')}</div>
    <span class="count">1 / ${n}</span>
    <button class="arr l" type="button" aria-label="Page précédente" disabled>‹</button><button class="arr r" type="button" aria-label="Page suivante">›</button></div>`;
}

function currentWeek(){
  const now = new Date(); const ws = DATA.weeks;
  for (const w of ws) { const s = new Date(w.start + 'T00:00:00'); const e = new Date(s); e.setDate(e.getDate() + 7);
    if (now >= s && now < e) return {w, state: 'now'}; }
  if (now < new Date(ws[0].start + 'T00:00:00')) return {w: ws[0], state: 'before'};
  return {w: ws[ws.length - 1], state: 'after'};
}

// ---- vues
function homeView(){
  const wk = currentWeek();
  const label = wk.state === 'now' ? 'Cette semaine' : wk.state === 'before' ? 'Première semaine de publication' : 'Dernière semaine du programme';
  return `<div class="goal"><h1 tabindex="-1">Programme LinkedIn Live Data — pilote</h1>
   <p>Objectif : personal branding de Joanna, Pierre et Simon, sur l'expertise de chacun, pour générer notoriété et leads. Leurs posts ne vendent pas les offres Live Data ; la page Live Data Solutions, elle, parle de nos solutions et de nos produits.</p></div>
  <div class="blk"><div class="wkhead"><h2>${label}<span class="tag">${wk.w.w}</span></h2><span class="lead" style="margin:0">${esc(wk.w.span)}</span></div>
   <p class="lead">Le post de chacun, prêt à copier et à télécharger.</p>
   <div class="grid4">${wk.w.ids.map(id => pcard(POSTS[id], true)).join('')}</div>
   <a class="more-l" href="#calendrier">Tout le calendrier ›</a></div>
  <div class="blk"><h2>Tous les posts, par auteur</h2><p class="lead">Cinq posts chacun, dans l'ordre de publication.</p>
   <div class="who4">${DATA.people.map(per => `<a class="au" href="#${per.key}"><img src="${per.photo}" alt=""><span class="ad"><b>${esc(perLabel(per))}</b><span>${esc(per.topics)}</span></span><em>5 posts ›</em></a>`).join('')}</div>
   <div class="quick"><a class="qk" href="#mode-emploi"><span>Mode d'emploi<small>Publier un post en 6 étapes, organisation, temps par semaine</small></span></a><a class="qk" href="#calendrier"><span>Calendrier<small>20 posts du 10 novembre au 10 décembre</small></span></a><a class="qk" href="#commentaires"><span>Mes commentaires<small>60 commentaires proposés aux équipes, filtre par prénom</small></span></a><a class="qk" href="#commenter"><span>Règles pour commenter<small>6 règles pour rester naturel aux yeux de LinkedIn</small></span></a></div></div>`;
}

function authorView(per){
  const note = per.key === 'L' ? 'Page entreprise : solutions et produits.' : 'Personal branding : ces posts ne vendent pas les offres Live Data.';
  return `<div class="ah"><img src="${per.photo}" alt=""><div><h1 class="v" tabindex="-1">${esc(per.key === 'L' ? 'Page Live Data Solutions' : per.name)}</h1><p><b>${esc(per.role)}</b> · ${esc(per.topics)}</p><p>${note} Cinq posts, dans l'ordre de publication.</p></div></div>
   <div class="grid5">${per.posts.map(p => pcard(p, false)).join('')}</div>`;
}

function postView(p){
  const per = PER[p.k], prev = per.posts[p.n - 2], next = per.posts[p.n];
  const dl = p.download.split('/').pop().split('?')[0];
  const st = status(p);
  const copyBtn = `<button class="btn pri copy" type="button" data-id="${p.id}">Copier le texte</button>`;
  const dlBtn = `<a class="btn dl" href="${p.download}" download="${dl}">Télécharger le visuel</a>`;
  return `<nav class="crumb" aria-label="Fil d'Ariane"><a href="#${per.key}">‹ Tous les posts ${per.key === 'L' ? 'de la page Live Data' : 'de ' + esc(per.first)}</a><span>Post ${p.n} sur 5</span></nav>
  <div class="pv">
   <div class="pvl"><article class="card" id="post-${p.id}">
    <div class="ch"><img src="${per.photo}" alt=""><div class="who"><b>${esc(per.name)}</b><span class="hl">${esc(per.headline)}</span><span class="dt"><em>Prévu</em> · ${esc(p.date)}</span></div><span class="pid">${p.id}</span></div>
    <div class="txt"><span class="body">${esc(p.text)}</span></div>
    ${media(p)}
    <div class="bar" aria-hidden="true"><span>J'aime</span><span>Commenter</span><span>Republier</span><span>Envoyer</span></div>
   </article></div>
   <div class="pvr">
    <div class="ph"><p class="pm"><b>${p.id}</b> · ${esc(p.date)}</p><h1 class="v" tabindex="-1">${esc(p.title)}</h1>${st ? `<span class="st">${st}</span>` : ''}</div>
    <div class="acts">${copyBtn}${dlBtn}
     <p class="kind">Visuel : ${esc(p.kind)}</p>
     <button class="btn lk link" type="button" data-id="${p.id}">Copier le lien du post</button></div>
    ${p.valider ? `<div class="val"><b>À valider par ${esc(p.valider_par)}</b>${esc(p.valider)}</div>` : ''}
    ${isNone(p.ressource) ? '' : `<div class="res"><b>Ressource proposée</b>${esc(p.ressource)}</div>`}
    <div class="info">
     <details><summary>Source — 1er commentaire</summary><div class="dd">${isNone(p.source) ? 'Aucune' : linkify(p.source) + `<br><button class="btn sm copysrc" type="button" data-id="${p.id}">Copier la source</button>`}</div></details>
     <details><summary>Pourquoi ce post</summary><div class="dd">${esc(p.pourquoi)}</div></details>
    </div>
    ${cmtBlock(p)}
    <nav class="pn" aria-label="Posts suivant et précédent">${prev ? `<a href="#${prev.id}"><b>‹ ${prev.id}</b>${esc(prev.title)}</a>` : '<span></span>'}${next ? `<a class="nx" href="#${next.id}"><b>${next.id} ›</b>${esc(next.title)}</a>` : `<a class="nx" href="#${per.key}"><b>Sommaire ›</b>Les 5 posts</a>`}</nav>
   </div>
  </div>
  <div class="mbar">${copyBtn}${dlBtn.replace('Télécharger le visuel', 'Télécharger')}</div>`;
}

function calView(){
  const t = document.getElementById('tpl-cal').content.cloneNode(true);
  const wk = currentWeek(); const tr = $(`tr[data-w="${wk.w.w}"]`, t);
  if (tr && wk.state !== 'after') { tr.classList.add('cur'); $('.now', tr).textContent = wk.state === 'now' ? 'cette semaine' : 'première semaine'; }
  return t;
}

// ---- routeur : #accueil, #J … #L, #J1 … #L5 (ou #post-J1), #calendrier, #mode-emploi (#organisation, #like-rdv, #publier)
const main = $('#main');
// barre basse mobile (Copier / Télécharger) : n'apparaît que quand les boutons du haut sont sortis de l'écran
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => document.body.classList.toggle('mbar-on', !e.isIntersecting && e.boundingClientRect.top < 0))) : null;
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const key = h.replace(/^post-/i, '').toUpperCase();
  let cur, title, anchor = null;
  if (POSTS[key]) { const p = POSTS[key]; main.innerHTML = postView(p); cur = p.k; title = `${p.id} · ${p.title}`; }
  else if (PER[key]) { main.innerHTML = authorView(PER[key]); cur = key; title = PER[key].first; }
  else if (/^commentaires(-[a-z]+)?$/.test(h)) { main.innerHTML = commentsView(h.split('-')[1] || ''); cur = 'commentaires'; title = 'Commentaires'; }
  else if (h === 'calendrier') { main.replaceChildren(calView()); cur = 'calendrier'; title = 'Calendrier'; }
  else if (['mode-emploi', 'organisation', 'like-rdv', 'publier', 'commenter'].includes(h)) {
    if (!$('#publier', main)) main.replaceChildren(document.getElementById('tpl-mode').content.cloneNode(true));
    cur = 'mode-emploi'; title = "Mode d'emploi"; anchor = h === 'mode-emploi' ? null : h; }
  else { main.innerHTML = homeView(); cur = 'accueil'; title = ''; }
  document.title = title ? `${title} — ${BASE}` : BASE;
  document.body.classList.toggle('haspost', !!POSTS[key]);
  document.body.classList.remove('mbar-on'); if (io) io.disconnect();
  const acts = $('.acts', main); if (acts && io) io.observe(acts);
  $$('.nv').forEach(a => a.dataset.r === cur ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (anchor) { const el = document.getElementById(anchor); if (el) el.scrollIntoView({block: 'start'}); }
  else window.scrollTo(0, 0);
  const h1 = $('h1', main); if (h1 && route.done) h1.focus({preventScroll: true});
  route.done = true;
  $$('.caro', main).forEach(swipe);
  $$('video', main).forEach(v => { v.muted = true; const pr = v.play(); if (pr) pr.catch(() => {}); });
}
window.addEventListener('hashchange', route);

// ---- interactions
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.matches('.arr')) { const c = t.closest('.caro'); go(c, +c.dataset.i + (t.classList.contains('r') ? 1 : -1)); return; }
  if (t.matches('.copy')) { copy(POSTS[t.dataset.id].text, t, 'Texte copié', 'Texte copié : collez-le dans LinkedIn'); return; }
  if (t.matches('.copysrc')) { copy(POSTS[t.dataset.id].source, t, 'Source copiée', 'Source copiée : à coller en 1er commentaire'); return; }
  if (t.matches('.copyc')) { copy(POSTS[t.dataset.id].comments[+t.dataset.i].text, t, 'Copié', 'Commentaire copié : réécrivez-le avec vos mots'); return; }
  if (t.matches('.copyr')) { copy(POSTS[t.dataset.id].reply.text, t, 'Copié', 'Réponse copiée : adaptez-la au commentaire reçu'); return; }
  if (t.matches('.link')) { copy(location.href.split('#')[0] + '#' + t.dataset.id, t, 'Lien copié', 'Lien du post copié'); return; }
  if (t.matches('.totop')) { window.scrollTo({top: 0, behavior: 'smooth'}); }
});
function go(c, i){
  const n = +c.dataset.n; i = Math.max(0, Math.min(n-1, i)); c.dataset.i = i;
  $('.track', c).style.transform = `translateX(${-100*i}%)`;
  $('.count', c).textContent = `${i+1} / ${n}`;
  $('.arr.l', c).disabled = i === 0; $('.arr.r', c).disabled = i === n-1;
}
function swipe(c){
  let x0 = null;
  c.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
  c.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) go(c, +c.dataset.i + (dx < 0 ? 1 : -1)); x0 = null; });
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2000); }
async function copy(text, btn, done, msg){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
  }
  window.__lastCopied = ok ? text : null;
  if (ok) { const old = btn.textContent; btn.textContent = done; btn.classList.add('ok'); toast(msg);
    setTimeout(()=>{ btn.textContent = old; btn.classList.remove('ok'); }, 1800); }
  else toast('Copie impossible : sélectionnez le texte à la main');
}
const totop = $('.totop');
window.addEventListener('scroll', () => totop.classList.toggle('on', scrollY > 700), {passive:true});
route();
</script>
</body></html>
